# CI: pre-commit + pytest, then deploy API image to Artifact Registry + Cloud Run.
#
# Required secret GCP_SA_KEY — full service account JSON key with:
#   Artifact Registry Writer, Cloud Run Admin, Service Account User
#
# Store as a **repository** secret (Settings → Secrets and variables → Actions →
# Repository secrets), OR on the GitHub Environment below (same name: GCP_SA_KEY).
#
# Optional repository variables (defaults match this project's GCP setup):
#   GCP_PROJECT_ID, GCP_REGION, AR_REPOSITORY, IMAGE_NAME, CLOUD_RUN_SERVICE
#   DEPLOY_ENVIRONMENT — override deploy environment name (default: github-actions)

name: CI and Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'tests/**'
      - 'conftest.py'
      - 'pytest.ini'
      - 'requirements*.txt'
      - 'shared/**'
      - '.github/workflows/deploy-api.yml'
      - '.pre-commit-config.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'personality-quiz-492907' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-west1' }}
  AR_REPOSITORY: ${{ vars.AR_REPOSITORY || 'personality-quiz-api' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'personality-quiz-api' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'personality-quiz-api' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Run pytest (no application / E2E tests)
        run: pytest -m "not application" --ignore=tests/test_integration.py

  deploy:
    name: Deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Environment-scoped secrets (e.g. GCP_SA_KEY) are only visible when the job
    # declares the environment. Repository secrets work with or without this line.
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'github-actions' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify GCP_SA_KEY secret
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::GCP_SA_KEY is missing or empty."
            echo "Add it as a Repository secret OR as a secret on the '${{ vars.DEPLOY_ENVIRONMENT || 'github-actions' }}' environment."
            echo "Settings → Secrets and variables → Actions"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE_BASE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE_TAG="${IMAGE_BASE}:${{ github.sha }}"
          docker build -f api/Dockerfile -t "${IMAGE_TAG}" -t "${IMAGE_BASE}:latest" .
          docker push "${IMAGE_TAG}"
          docker push "${IMAGE_BASE}:latest"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          gcloud run deploy "${{ env.CLOUD_RUN_SERVICE }}" \
            --image "${IMAGE}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --platform managed \
            --quiet
