# CI: pre-commit + pytest, then deploy API image to Artifact Registry + Cloud Run.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   GCP_SA_KEY — full service account JSON (Artifact Registry Writer, Cloud Run Admin,
#                Service Account User)
#   GEMINI_API_KEY — Gemini API key (injected into Cloud Run on each deploy)
#
# Optional repository secrets (defaults shown):
#   GCP_PROJECT_ID, GCP_REGION, AR_REPOSITORY, IMAGE_NAME, CLOUD_RUN_SERVICE,
#   GCS_QUIZZES_BUCKET

name: CI and Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'tests/**'
      - 'conftest.py'
      - 'pytest.ini'
      - 'requirements*.txt'
      - 'shared/**'
      - '.github/workflows/deploy-api.yml'
      - '.pre-commit-config.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Run pytest (no application / E2E tests)
        run: pytest -m "not application" --ignore=tests/test_integration.py

  deploy:
    name: Deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'personality-quiz-492907' }}
      GCP_REGION: ${{ secrets.GCP_REGION || 'us-west1' }}
      AR_REPOSITORY: ${{ secrets.AR_REPOSITORY || 'personality-quiz-api' }}
      IMAGE_NAME: ${{ secrets.IMAGE_NAME || 'personality-quiz-api' }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE || 'personality-quiz-api' }}
      GCS_QUIZZES_BUCKET: ${{ secrets.GCS_QUIZZES_BUCKET }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::GCP_SA_KEY is missing or empty."
            echo "Add it under Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is missing or empty."
            echo "Add it under Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE_BASE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE_TAG="${IMAGE_BASE}:${{ github.sha }}"
          docker build -f api/Dockerfile -t "${IMAGE_TAG}" -t "${IMAGE_BASE}:latest" .
          docker push "${IMAGE_TAG}"
          docker push "${IMAGE_BASE}:latest"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCS_QUIZZES_BUCKET: ${{ env.GCS_QUIZZES_BUCKET }}
        run: |
          DEPLOY_ARGS=(
            --image "${IMAGE}"
            --region "${{ env.GCP_REGION }}"
            --project "${{ env.GCP_PROJECT_ID }}"
            --platform managed
            --quiet
          )
          ENV_UPDATES=("GEMINI_API_KEY=${GEMINI_API_KEY}")
          if [ -n "$GCS_QUIZZES_BUCKET" ]; then
            ENV_UPDATES+=("GCS_QUIZZES_BUCKET=${GCS_QUIZZES_BUCKET}")
          fi
          IFS=,
          DEPLOY_ARGS+=(--update-env-vars "${ENV_UPDATES[*]}")
          gcloud run deploy "${{ env.CLOUD_RUN_SERVICE }}" "${DEPLOY_ARGS[@]}"
